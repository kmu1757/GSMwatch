name: CI

# 모든 브랜치 push / PR 에서 빌드·단위테스트·스크린샷 테스트를 돌린다.
# (릴리스 서명·배포는 release.yml 이 v* 태그에서 담당)
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: JDK 21 세팅
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 세팅
        uses: gradle/actions/setup-gradle@v5

      - name: 단위 테스트 (:core 로직)
        run: ./gradlew --stacktrace :core:testDebugUnitTest

      - name: 디버그 APK 빌드 (워치 + 폰)
        run: ./gradlew --stacktrace :app:assembleDebug :gsmhub:assembleDebug

      # 릴리스(R8 축소) 빌드도 미리 확인해 태그 릴리스 때 깨지지 않게 한다 (서명은 release.yml 담당)
      - name: 릴리스 APK 빌드 확인
        run: ./gradlew --stacktrace :app:assembleRelease :gsmhub:assembleRelease

      # Robolectric 로 워치(원형)·폰(라이트/다크) 화면을 렌더링해 PNG 로 남긴다 (에뮬레이터 불필요)
      - name: 화면 스크린샷 기록 (Roborazzi)
        run: ./gradlew --stacktrace :app:recordRoborazziDebug :gsmhub:recordRoborazziDebug

      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: '**/build/outputs/roborazzi/**/*.png'
          if-no-files-found: warn

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
