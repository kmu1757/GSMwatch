name: CI

# 모든 브랜치 push / PR 에서 빌드·단위테스트·스크린샷 테스트를 돌린다.
# (릴리스 서명·배포는 release.yml 이 v* 태그에서 담당)
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: JDK 21 세팅
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 세팅
        uses: gradle/actions/setup-gradle@v5

      - name: 단위 테스트
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: 디버그 APK 빌드 (워치 + 폰)
        run: ./gradlew --stacktrace :app:assembleDebug :gsmhub:assembleDebug

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
