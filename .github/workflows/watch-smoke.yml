name: Watch Smoke Test

# 릴리스(R8) APK 를 Wear OS 에뮬레이터에 설치·실행해 NEIS 조회가 실제로 되는지 확인 (수동 실행)
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: JDK 21 세팅
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 세팅
        uses: gradle/actions/setup-gradle@v5

      - name: local.properties(비밀금고) 생성
        run: |
          echo "DATA_GSM_API_KEY=\"${{ secrets.API_KEY }}\"" > local.properties
          echo "BOT_API_URL=\"${{ secrets.BOT_API_URL }}\"" >> local.properties

      - name: 릴리스 APK 빌드·서명
        run: |
          ./gradlew --stacktrace :app:assembleRelease
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner sign --ks keystore/release.keystore --ks-pass pass:"gsmwatch" --out watch.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Wear OS 에뮬레이터에서 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/watch-smoke.sh watch.apk

      - name: logcat 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: watch-logcat
          path: logcat.txt
          if-no-files-found: ignore
